<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="circleClip"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Blue field -->
    <rect width="100" height="100" fill="#00247d" />

    <!-- Union Jack (simplified) in canton -->
    <g transform="scale(1)" width="50" height="50">
      <rect x="0" y="0" width="50" height="50" fill="#012169" />
      <!-- White diagonals -->
      <polygon points="0,0 8,0 50,36 50,50 42,50 0,14" fill="#fff" />
      <polygon points="50,0 50,8 14,50 0,50 0,42 36,0" fill="#fff" />
      <!-- Red diagonals -->
      <polygon points="0,0 4,0 50,38 50,42 46,42 0,4" fill="#C8102E" />
      <polygon points="50,0 50,4 12,50 8,50 4,46 46,4" fill="#C8102E" />
      <!-- White cross -->
      <rect x="20" y="0" width="10" height="50" fill="#fff" />
      <rect x="0" y="20" width="50" height="10" fill="#fff" />
      <!-- Red cross -->
      <rect x="22" y="0" width="6" height="50" fill="#C8102E" />
      <rect x="0" y="22" width="50" height="6" fill="#C8102E" />
    </g>

    <!-- Commonwealth star (large 7-point) near canton bottom-left -->
    <g transform="translate(18,60) scale(0.9)">
      <polygon points="0,-10 2,-3 9,-3 3,1 6,8 0,4 -6,8 -3,1 -9,-3 -2,-3" fill="#fff" transform="translate(10,-20) scale(1.6)" />
      <polygon points="0,-10 2,-3 9,-3 3,1 6,8 0,4 -6,8 -3,1 -9,-3 -2,-3" fill="#fff" transform="translate(10,-8) scale(1.4)" opacity="0" />
    </g>

    <!-- Southern Cross (simplified) -->
    <g fill="#fff" transform="translate(40,22) scale(0.75)">
      <polygon points="0,-6 1.2,-1.2 6,-1.2 2.4,1 3.8,6 0,3  -3.8,6 -2.4,1 -6,-1.2 -1.2,-1.2" />
    </g>
    <g fill="#fff" transform="translate(60,34) scale(0.55)">
      <polygon points="0,-6 1.2,-1.2 6,-1.2 2.4,1 3.8,6 0,3 -3.8,6 -2.4,1 -6,-1.2 -1.2,-1.2" />
    </g>
    <g fill="#fff" transform="translate(52,56) scale(0.9)">
      <polygon points="0,-8 1.6,-1.6 8,-1.6 3.2,1.2 5.2,8 0,4 -5.2,8 -3.2,1.2 -8,-1.6 -1.6,-1.6" />
    </g>
    <g fill="#fff" transform="translate(70,52) scale(0.65)">
      <polygon points="0,-6 1.2,-1.2 6,-1.2 2.4,1 3.8,6 0,3 -3.8,6 -2.4,1 -6,-1.2 -1.2,-1.2" />
    </g>
  </g>
</svg>
