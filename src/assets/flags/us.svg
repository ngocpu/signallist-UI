<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="circleClip"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Stripes -->
    <rect width="100" height="100" fill="#b22234" />
    <g fill="#fff">
      <rect y="10" width="100" height="10" />
      <rect y="30" width="100" height="10" />
      <rect y="50" width="100" height="10" />
      <rect y="70" width="100" height="10" />
    </g>
    <!-- Canton -->
    <rect x="0" y="0" width="40" height="35" fill="#3C3B6E" />
    <!-- Simple star grid (stylized) -->
    <g fill="#fff" transform="translate(4,6) scale(0.6)">
      <polygon points="3,0 3.9,2.1 6.2,2.1 4.3,3.5 5.2,5.6 3,4.3 0.8,5.6 1.7,3.5 -0.2,2.1 2.1,2.1" />
      <g transform="translate(8,0)">
        <polygon points="3,0 3.9,2.1 6.2,2.1 4.3,3.5 5.2,5.6 3,4.3 0.8,5.6 1.7,3.5 -0.2,2.1 2.1,2.1" />
      </g>
      <g transform="translate(0,6)">
        <polygon points="3,0 3.9,2.1 6.2,2.1 4.3,3.5 5.2,5.6 3,4.3 0.8,5.6 1.7,3.5 -0.2,2.1 2.1,2.1" />
      </g>
    </g>
  </g>
</svg>
